name: task_ai
description: "TaskAI v3.0 - Gestión de tareas con IA on-device y persistencia Firebase."
publish_to: 'none'

version: 3.0.0+3

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^15.1.2
  uuid: ^4.5.1
  intl: ^0.20.2
  speech_to_text: ^7.0.0
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.0.0
  permission_handler: ^11.0.0
  # AI / notifications
  firebase_ai: ^2.3.0
  firebase_app_check: ^0.3.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  # Local cache
  hive_flutter: ^1.1.0
  # Connectivity
  connectivity_plus: ^6.1.0
  # UI / branding
  shared_preferences: ^2.3.0
  google_mobile_ads: ^9.1.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  flutter_native_splash: ^2.4.0
  mockito: ^5.4.4
  fake_cloud_firestore: ^3.0.0
  firebase_auth_mocks: ^0.14.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/splash_icon.png"
  min_sdk_android: 21
